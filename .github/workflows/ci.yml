name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Fail on syntax errors / undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style check (report only, non-blocking)
        run: flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Compile check
        run: python -m py_compile face_guard.py

      - name: Verify bundled Haar cascades load correctly
        run: |
          python -c "
          import glob
          import cv2
          for path in sorted(glob.glob('assets/*.xml')):
              cascade = cv2.CascadeClassifier(path)
              assert not cascade.empty(), f'{path} failed to load (empty cascade)'
              print(f'OK: {path}')
          "